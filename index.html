<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Špagato kelias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F4FD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Špagatas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — one narrow column, fixed bottom tab bar, bottom sheets for detail, full-screen player. */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#E8ECEA; --ink:#121917; --muted:#5D6A65; --line:#DCE2DF;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD; --good:#1F8A57; --good-soft:#DCF1E6; --warn:#C2410C; --warn-soft:#FDE7DA;
  --hero:#121917; --hero-ink:#F3F6F4; --hero-muted:#9DABA5;
  --shadow:0 1px 2px rgba(18,25,23,.06),0 6px 20px rgba(18,25,23,.06);
  --nav:rgba(255,255,255,.82);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#161E1C; --surface-2:#1F2927; --ink:#E9EFEC; --muted:#93A29C; --line:#26312E;
    --accent:#7C9DFF; --accent-ink:#0A1230; --accent-soft:#1B2647; --good:#4CC48A; --good-soft:#133224; --warn:#FB923C; --warn-soft:#3A2214;
    --hero:#1C2624; --hero-ink:#F3F6F4; --hero-muted:#9DABA5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --nav:rgba(22,30,28,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#161E1C; --surface-2:#1F2927; --ink:#E9EFEC; --muted:#93A29C; --line:#26312E;
  --accent:#7C9DFF; --accent-ink:#0A1230; --accent-soft:#1B2647; --good:#4CC48A; --good-soft:#133224; --warn:#FB923C; --warn-soft:#3A2214;
  --hero:#1C2624; --hero-ink:#F3F6F4; --hero-muted:#9DABA5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --nav:rgba(22,30,28,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;animation:in .28s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:2rem;font-weight:800;line-height:1.05}
h2{font-size:1.3rem;font-weight:800;line-height:1.15}
h3{font-size:1.02rem;font-weight:600;line-height:1.25}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{border:0;border-radius:16px;padding:15px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.light{background:var(--hero-ink);color:var(--hero)}
.btn.block{width:100%}
svg.fig{display:block;width:100%;height:auto}
.fbox,.p-fig{overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;font-size:.92rem}

/* header + stats */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
.streak .ico{width:18px;height:18px;color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}

/* today card */
.today{background:var(--hero);color:var(--hero-ink);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.today .fbox{border-radius:0}
.today .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.today .eyebrow{color:var(--hero-muted)}
.today .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--hero-muted);font-size:.9rem;font-weight:600}
.today .meta span{display:inline-flex;align-items:center;gap:5px}
.today .meta .ico{width:16px;height:16px}
.today .row{display:flex;gap:10px}
.today .row .btn{flex:1}
.today .row .btn.sq{flex:none;width:54px;padding:0;background:rgba(255,255,255,.12);color:var(--hero-ink)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}

/* weeks */
.week{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);border-radius:14px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;box-shadow:var(--shadow);transition:transform .12s}
.day:active{transform:scale(.94)}
.day b{font-family:var(--display);font-size:1.1rem;line-height:1.1;font-variant-numeric:tabular-nums}
.day span{font-size:.6rem;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.day.done{background:var(--good);color:#fff}
.day.done span{color:rgba(255,255,255,.85)}
.day.next{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.day.rest{background:var(--surface-2);box-shadow:none}
.day.done.rest{background:var(--good)}
.note{font-size:.88rem;color:var(--muted);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note b{color:var(--ink)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.ex{border:0;background:var(--surface);border-radius:18px;display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:8px 12px 8px 8px;align-items:center;text-align:left;width:100%;box-shadow:var(--shadow);transition:transform .12s}
.ex:active{transform:scale(.98)}
.ex .fbox{border-radius:12px}
.ex .info{min-width:0;display:flex;flex-direction:column;gap:1px}
.ex .dose{font-weight:700;color:var(--accent);font-size:.88rem;font-variant-numeric:tabular-nums}
.ex .chev{color:var(--muted)}
.back{background:var(--surface);border:0;width:42px;height:42px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.dayhead{display:flex;flex-direction:column;gap:6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surface);color:var(--muted)}
.pill .ico{width:15px;height:15px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap;box-shadow:var(--shadow)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:0;background:var(--surface);border-radius:18px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.97)}
.card .fbox{border-radius:12px}
.card h3{padding-inline:4px;font-size:.95rem}
.card .cat{padding-inline:4px;font-size:.75rem;color:var(--muted);font-weight:600}

/* sticky action + nav */
.sticky{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 65%,transparent);display:flex;justify-content:center;z-index:5}
.sticky .in{max-width:560px;width:100%;display:flex;gap:10px}
.sticky .in .btn:first-child{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;min-width:0;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button .ico{width:24px;height:24px}

/* progress page */
.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.heat i.on{background:var(--good);color:#fff}
.hist{display:flex;flex-direction:column}
.hist .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist .r:first-child{border-top:0}
.tag{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.l{background:var(--good-soft);color:var(--good)}
.tag.s{background:var(--warn-soft);color:var(--warn)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.set .t{display:flex;flex-direction:column;min-width:0}
.set .t small{color:var(--muted);font-size:.82rem}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:7px 10px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,11,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40%);opacity:.5}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet .fbox{border-radius:18px;position:relative}
.sheet .close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(18,25,23,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:12px;position:relative}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);margin-top:6px;background:var(--surface);z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;left:7px;top:20px;bottom:-4px;width:2px;background:var(--line)}

/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fade .2s ease both}
.p-in{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;min-height:0}
.p-top{display:flex;align-items:center;gap:10px}
.segs{flex:1;display:flex;gap:3px}
.segs i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.segs i.d{background:var(--good)}
.segs i.c{background:var(--accent)}
.iconbtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none}
.p-fig{flex:1;min-height:160px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#F7F7FB 50%,#D2D2DE 50%);border-radius:24px;position:relative;touch-action:pan-y}
.p-fig svg{max-height:100%;width:auto;max-width:100%;height:100%}
.p-fig .side{position:absolute;top:12px;left:12px}
.side{display:inline-flex;font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.p-mid{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.p-name{display:flex;flex-direction:column;gap:4px;min-width:0}
.p-desc{font-size:.92rem;line-height:1.45;color:var(--muted);margin-top:-4px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--surface-2);stroke-width:9}
.ring .val{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.prep .val{stroke:var(--warn)}
.ring.reps .val{stroke:var(--good)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .lbl b{font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.ring .lbl small{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px}
.ctrl .sm{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.ctrl .main{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,79,209,.35);transition:transform .12s}
.ctrl .main:active,.ctrl .sm:active{transform:scale(.93)}
.ctrl .main .ico{width:30px;height:30px}
.ctrl .main.done{background:var(--good);box-shadow:0 8px 24px rgba(31,138,87,.35)}
.next-up{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.85rem;color:var(--muted)}
.fin{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.fin .badge{width:96px;height:96px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;align-self:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.fin .badge .ico{width:48px;height:48px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{border:0;background:var(--surface);border-radius:14px;padding:12px 4px;font-weight:700;box-shadow:var(--shadow)}
.feel button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* level chip + test */
.lvchip{margin-top:8px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.82rem;border-radius:999px;padding:5px 8px 5px 12px;display:inline-flex;align-items:center;gap:2px}
.lvchip .ico{width:16px;height:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:0;background:var(--surface);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:600;box-shadow:var(--shadow);transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt.on{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.opt .t2{display:flex;flex-direction:column;gap:2px}
.opt .t2 small{color:var(--muted);font-weight:500;font-size:.85rem;line-height:1.4}
.dotn{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;flex:none}
/* track cards + session grid */
.tracks{display:flex;flex-direction:column;gap:12px;text-align:left}
.tcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:132px 1fr;overflow:hidden}
.tcard .tfig{border:0;padding:0;background:linear-gradient(#F7F7FB 50%,#D2D2DE 50%);display:flex;align-items:center;min-height:100%}
.tcard .tfig .fbox{width:100%;border-radius:0}
.tcard .tbody{padding:14px 14px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard h2{font-size:1.25rem}
.tsub{font-size:.85rem;line-height:1.35}
.tmeta{font-size:.85rem;font-weight:700;color:var(--accent)}
.tcard.did .tmeta{color:var(--good)}
.tbtn{padding:11px 14px;font-size:.92rem;border-radius:14px}
.tbtn .ico{width:16px;height:16px}
.sgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sg{border:0;aspect-ratio:1;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;padding:0}
.sg.done{background:var(--good);color:#fff}
.sg.cur{box-shadow:0 0 0 2px var(--accent) inset;color:var(--ink)}
.heat.h8{grid-template-columns:repeat(8,1fr)}
.nextq{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:6px}
.fin{justify-content:flex-start;padding-top:12px}
/* health */
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.88rem}
.field input,input.mini{font:inherit;font-size:1.05rem;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
input.mini{width:96px;padding:8px 10px;text-align:right;flex:none}
.field input:focus,input.mini:focus{outline:none;border-color:var(--accent)}
.err{color:var(--warn);font-size:.88rem;font-weight:600}
.fcol{display:flex;flex-direction:column;gap:14px}
.seg.wide{display:flex;width:100%}

function slots(m) {
  if (m.when === "sleep") { const t = (m.times && m.times[0]) || "22:00"; return [{ key: "sleep", label: "prieš miegą " + t, due: mins(t) }]; }
  if (m.when === "time") return (m.times || []).slice().sort().map(t => ({ key: t, label: t, due: mins(t) }));
  return (m.meals || []).map(k => ({ key: k, label: MEALS[k].toLowerCase(), due: MEAL_HOUR[k] * 60 }));
}
const medActive = (m, day) => (!m.start || day >= m.start) && (!m.end || day <= m.end);

const iso = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 864e5);

function weightDue() {

function guessMeal() { const hr = new Date().getHours(); return hr < 11 ? "b" : hr < 16 ? "l" : hr < 21 ? "d" : "s"; }
/* šiandienos vaistų dozės: vaistas × valgis */

function weightChart(ws, goal) {
  const W = 320, Hh = 150, L = 36, R = 12, T = 14, B = 24;
  const vals = ws.map(w => w.kg).concat(goal ? [goal] : []);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const t0 = fromIso(ws[0].d).getTime(), t1 = Math.max(fromIso(ws[ws.length - 1].d).getTime(), t0 + 864e5);
  const x = d => L + (fromIso(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (Hh - T - B);
  const step = Math.max(1, Math.ceil((hi - lo) / 3));
  let g = "";
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  if (goal) g += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/><text class="ax" x="${W - R}" y="${y(goal) - 5}" text-anchor="end">tikslas ${kg(goal)}</text>`;
  g += `<text class="ax" x="${L}" y="${Hh - 6}">${fmtDate(ws[0].d)}</text><text class="ax" x="${W - R}" y="${Hh - 6}" text-anchor="end">${fmtDate(ws[ws.length - 1].d)}</text>`;
  const pts = ws.map(w => [x(w.d), y(w.kg)]);
  const area = `M${pts[0][0]},${Hh - B} ` + pts.map(p => "L" + p.join(",")).join(" ") + ` L${pts[pts.length - 1][0]},${Hh - B}Z`;
  g += `<path class="area" d="${area}"/><polyline class="line" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
  pts.forEach((p, i) => { g += `<circle class="pt${i === pts.length - 1 ? " last" : ""}" cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 4}"/>`; });
  const lp = pts[pts.length - 1];
  g += `<text class="lv" x="${Math.min(lp[0], W - R - 4)}" y="${lp[1] - 10}" text-anchor="end">${kg(ws[ws.length - 1].kg)}</text>`;
  g += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${Hh - B}" visibility="hidden"/>`;
  const wrap = h("div", { class: "chart" });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Svorio kitimas">${g}</svg>`;
  const tip = h("div", { class: "tip", hidden: "" }); wrap.append(tip);
  const svg = wrap.firstChild, cross = svg.querySelector(".cross");
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    let bi = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - px) < Math.abs(pts[bi][0] - px)) bi = i; });
    cross.setAttribute("x1", pts[bi][0]); cross.setAttribute("x2", pts[bi][0]); cross.setAttribute("visibility", "visible");
    tip.textContent = fmtDate(ws[bi].d) + " · " + kg(ws[bi].kg) + " kg"; tip.hidden = false;
    tip.style.left = Math.min(Math.max(pts[bi][0] / W * 100, 15), 85) + "%";
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  return wrap;

}
const buzz = ms => { if (!store.settings.vib) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
async function lockScreen() { try { wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; } }
document.addEventListener("visibilitychange", () => { if (P_ && document.visibilityState === "visible") lockScreen(); });
const RING_C = 2 * Math.PI * 52;

function startPlayer(t, n, skipWarm) {
  closeSheet();
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  if (!wake) lockScreen();
  const steps = [];
  for (const [title, items] of sess(t, n).sections) {
    if (skipWarm && title === "Apšilimas") continue;
    for (const it of items) {
      const v = eff(it);
      if (it.sides) { steps.push({ ...it, v, side: "Dešinė koja", mirror: false }); steps.push({ ...it, v, side: "Kairė koja", mirror: true }); }

    root: h("div", { class: "player", role: "dialog", "aria-modal": "true", "aria-label": "Treniruotė" }) };

}
function closePlayer() {
  if (!P_) return;

}
function goStep(i) {

  const s = P_.steps[i];

}
function tick() {

  const now = performance.now(), dt = (now - P_.last) / 1000; P_.last = now;
  P_.left -= dt;

  updateCounter();

    if (P_.phase === "prep") { P_.phase = "work"; P_.left = s.v; P_.lastSec = null; beep(990, .25); buzz(150); renderPlayer(false); }

}
function updateCounter() {
  const r = P_ && P_.root.querySelector(".ring"); if (!r) return;
  const s = P_.steps[P_.i];

  if (s.type !== "reps") {

    frac = Math.max(0, P_.left) / (P_.phase === "prep" ? 5 : s.v);

}
function renderPlayer(newFig) {
  const s = P_.steps[P_.i], ex = EX[s.id], total = P_.steps.length;
  const r = P_.root;
  const old = r.querySelector(".p-fig");
  const fig = (!newFig && old) ? old : h("div", { class: "p-fig" }, makeFig(s.id, s.mirror), s.side ? h("span", { class: "side" }, s.side) : null);
  if (fig !== old) {
    let x0 = null;
    fig.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    fig.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (dx < -60) goStep(P_.i + 1); else if (dx > 60) goStep(P_.i - 1); });
  }
  const nxt = P_.steps[P_.i + 1], reps = s.type === "reps";
  const ringSvg = document.createElementNS(NS, "svg"); ringSvg.setAttribute("viewBox", "0 0 120 120");
  ringSvg.innerHTML = `<circle class="trk" cx="60" cy="60" r="52"/><circle class="val" cx="60" cy="60" r="52" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="0"/>`;
  const ring = h("div", { class: "ring" + (reps ? " reps" : P_.phase === "prep" ? " prep" : "") }, ringSvg,
    h("div", { class: "lbl" }, h("b", {}, reps ? "×" + s.v : "0"), h("small", {}, reps ? "kartų" : P_.phase === "prep" ? "pasiruošk" : s.type === "hold" ? "laikyk" : "judėk")));
  const segs = h("div", { class: "segs", "aria-label": "Pratimas " + (P_.i + 1) + " iš " + total });
  for (let k = 0; k < total; k++) segs.append(h("i", { class: k < P_.i ? "d" : k === P_.i ? "c" : "" }));

    ? h("button", { class: "main done", "aria-label": "Atlikta", on: { click: () => { beep(990, .2); buzz(60); goStep(P_.i + 1); } } }, icon("check"))
    : h("button", { class: "main", "aria-label": P_.paused ? "Tęsti" : "Pauzė", on: { click: () => { P_.paused = !P_.paused; P_.last = performance.now(); renderPlayer(false); } } }, icon(P_.paused ? "play" : "pause"));
  r.replaceChildren(h("div", { class: "p-in" },
    h("div", { class: "p-top" },
      h("button", { class: "iconbtn", "aria-label": "Uždaryti", on: { click: closePlayer } }, icon("close")),
      segs,
      h("button", { class: "iconbtn", "aria-label": store.settings.sound ? "Išjungti garsą" : "Įjungti garsą", on: { click: () => { store.settings.sound = !store.settings.sound; save(); renderPlayer(false); } } }, icon(store.settings.sound ? "sound" : "mute"))),
    fig,
    h("div", { class: "p-mid" },
      h("div", { class: "p-name" }, h("p", { class: "eyebrow num" }, TRACKS[P_.t].n + " · " + (P_.i + 1) + " / " + total), h("h2", {}, ex.n)),
      ring),
    h("p", { class: "p-desc" }, ex.d),
    h("div", { class: "ctrl" },

    h("p", { class: "next-up" }, nxt ? "Toliau: " + EX[nxt.id].n + (nxt.side ? " · " + nxt.side.toLowerCase() : "") : "Paskutinis pratimas")));

}
function finish() {

    h("div", {}, h("h1", {}, TRACKS[t].n + " atlikta!"),
      h("p", { class: "muted", style: "margin-top:6px" }, (n === SESS ? "Testas" : "Treniruotė " + n) + " · " + min + " min · serija " + streak() + " d.")),
    others.length ? h("div", { class: "nextq" },
      h("h2", {}, "Ką darysi toliau?"),
      h("p", { class: "muted" }, "Raumenys jau sušilę, todėl apšilimą praleisime."),
      h("div", { class: "tracks" }, others.map(x => trackCard(x, { skipWarm: true, startLabel: "Tęsti su " + TRACKS[x].n.toLowerCase(), onStart: (tt, nn) => startPlayer(tt, nn, true), onOpen: () => closePlayer() }))))
      : h("p", { class: "muted" }, "Šiandien atlikai abi treniruotes. Puikus darbas!"),
    h("button", { class: others.length ? "btn ghost block" : "btn block", on: { click: () => { location.hash = ""; closePlayer(); } } }, "Baigti šiandien"))));
}
