<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Špagato kelias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F4FD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Špagatas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a training log; day tiles in 7-wide week strips; full-screen player. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#141C19; --muted:#5B6863; --line:#D6DDD9;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --far:#A3B0AB; --good:#23885A; --good-soft:#DDF0E6;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1312; --surface:#172020; --ink:#E7EEEB; --muted:#93A29C; --line:#26312F;
    --accent:#7598FF; --accent-ink:#0A1230; --far:#4A5A56; --good:#4CC48A; --good-soft:#163428;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#172020; --ink:#E7EEEB; --muted:#93A29C; --line:#26312F;
  --accent:#7598FF; --accent-ink:#0A1230; --far:#4A5A56; --good:#4CC48A; --good-soft:#163428;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800;line-height:1.05}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
svg.fig{display:block;width:100%;height:auto}
svg.fig .gnd{stroke:var(--line);stroke-width:3;stroke-linecap:round}
svg.fig .lim{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
svg.fig .near{stroke:var(--accent)}
svg.fig .farl{stroke:var(--far)}
svg.fig .body{stroke:var(--ink)}
svg.fig .head{fill:var(--surface);stroke:var(--ink);stroke-width:6}
svg.fig .tgt{fill:none;stroke:var(--good);stroke-width:3;stroke-dasharray:4 4}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.goal{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr 120px;gap:14px;align-items:center}
.hero .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--good);border-radius:99px}
.hero .btn{margin-top:6px}
.num{font-variant-numeric:tabular-nums}

/* weeks */
.week{display:flex;flex-direction:column;gap:10px}
.week-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.day b{font-family:var(--display);font-size:1.15rem;line-height:1.1;font-variant-numeric:tabular-nums}
.day span{font-size:.62rem;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.day.done{background:var(--good-soft);border-color:var(--good)}
.day.done span{color:var(--good)}
.day.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.85rem;color:var(--muted)}
.legend b{color:var(--ink);font-weight:700}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px}

/* day view */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.list{display:flex;flex-direction:column;gap:10px}
.sec{margin-top:6px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:76px 1fr;gap:12px;padding:8px 12px 8px 8px;align-items:center;text-align:left;width:100%}
.ex .fbox{background:var(--bg);border-radius:12px}
.ex .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.ex .dose{font-weight:700;color:var(--accent);font-size:.9rem;font-variant-numeric:tabular-nums}
.ex .desc{font-size:.9rem;color:var(--muted);display:none}
.ex.open .desc{display:block}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;z-index:5}
.sticky .in{max-width:560px;width:100%;display:flex;gap:10px}
.sticky .in .btn:first-child{flex:1}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lib .card .fbox{background:var(--bg);border-radius:12px}
.lib .card p{font-size:.84rem;color:var(--muted)}

/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-in{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;min-height:0}
.p-top{display:flex;align-items:center;gap:12px}
.p-top .meter{flex:1}
.x{border:0;background:var(--surface);width:40px;height:40px;border-radius:12px;font-size:1.2rem;border:1px solid var(--line)}
.p-fig{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:22px;border:1px solid var(--line)}
.p-fig svg{max-height:100%;width:auto;max-width:100%;height:100%}
.p-name{display:flex;flex-direction:column;gap:4px}
.side{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);align-self:flex-start}
.p-desc{font-size:.92rem;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.big small{display:block;font-family:var(--body);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.big.prep{color:var(--muted)}
.ctrl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px}
.ctrl .round{border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:1.3rem}
.next-up{font-size:.85rem;color:var(--muted);text-align:center}
.fin{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.fin .big{color:var(--good)}
@media (max-height:640px){.big{font-size:3.2rem}.p-desc{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- Figūrėlės modelis ---------- */
const RAD = Math.PI / 180;
const LEN = { torso: 50, neck: 6, head: 9, ua: 24, fa: 22, th: 33, sh: 33, foot: 7 };
const GROUND = 186;
const S = { t: 180, la: [0, 0], ra: [0, 0], ll: [0, 0], rl: [0, 0] };
const P = o => Object.assign({}, S, o);

function joints(p, front, mirror) {
  const dir = a => [Math.sin(a * RAD), Math.cos(a * RAD)];
  const add = (o, a, l) => { const v = dir(a); return [o[0] + v[0] * l, o[1] + v[1] * l]; };
  const hip = [0, 0];
  const top = add(hip, p.t, LEN.torso);
  const head = add(top, p.t, LEN.neck + LEN.head);
  const tv = dir(p.t), perp = [-tv[1], tv[0]];
  const sw = front ? 11 : 0, hw = front ? 7 : 0;
  const shR = [top[0] + perp[0] * sw, top[1] + perp[1] * sw];
  const shL = [top[0] - perp[0] * sw, top[1] - perp[1] * sw];
  const hipR = [hw, 0], hipL = [-hw, 0];
  const eR = add(shR, p.ra[0], LEN.ua), hR = add(eR, p.ra[1], LEN.fa);
  const eL = add(shL, p.la[0], LEN.ua), hL = add(eL, p.la[1], LEN.fa);
  const kR = add(hipR, p.rl[0], LEN.th), fR = add(kR, p.rl[1], LEN.sh);
  const kL = add(hipL, p.ll[0], LEN.th), fL = add(kL, p.ll[1], LEN.sh);
  const tR = front ? fR : add(fR, p.rl[1] + 90, LEN.foot);
  const tL = front ? fL : add(fL, p.ll[1] + 90, LEN.foot);
  const j = { hip, top, head, shR, shL, hipR, hipL, eR, hR, eL, hL, kR, fR, tR, kL, fL, tL };
  if (mirror) for (const k in j) j[k] = [-j[k][0], j[k][1]];
  return j;
}
function maxY(j) { let m = j.head[1] + LEN.head; for (const k in j) if (j[k][1] > m) m = j[k][1]; return m; }
function anchorX(j, a) {
  if (!a) return 0;
  if (a === "feet") return (j.fL[0] + j.fR[0]) / 2;
  return ({ lf: j.fL, rf: j.fR, lk: j.kL, rk: j.kR, hip: j.hip })[a][0];
}
function lerpPose(a, b, u) {
  const l = (x, y) => x + (y - x) * u;
  return { t: l(a.t, b.t), la: [l(a.la[0], b.la[0]), l(a.la[1], b.la[1])], ra: [l(a.ra[0], b.ra[0]), l(a.ra[1], b.ra[1])],
    ll: [l(a.ll[0], b.ll[0]), l(a.ll[1], b.ll[1])], rl: [l(a.rl[0], b.rl[0]), l(a.rl[1], b.rl[1])] };
}
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

/* ---------- Pratimai ---------- */
const GUARD_S = { la: [25, 160], ra: [15, 168] };
const GUARD_F = { la: [-18, 172], ra: [18, -172] };
const HIPS_S = { la: [-30, 60], ra: [-30, 60] };
const HIPS_F = { la: [-35, 55], ra: [35, -55] };

const EX = {
  warm_jog: { n: "Aukšti keliai", v: "side", d: "Bėk vietoje keldamas kelius iki klubų aukščio, rankos dirba kartu. Sušildo raumenis prieš tempimą.",
    k: [[P({ rl: [80, 0], ra: [-35, 30], la: [40, 140] }), .35], [P({ ll: [80, 0], la: [-35, 30], ra: [40, 140] }), .35]] },

    k: [[P({ ra: [90, 90], la: [90, 90] }), .9], [P({ t: 150, rl: [95, -25], ll: [95, -25], ra: [90, 90], la: [90, 90] }), .9]] },
  swing_front: { n: "Kojos mostai pirmyn", v: "side", a: "lf", d: "Laikykis už sienos ar kėdės. Tiesia koja mojuok pirmyn ir atgal, kaskart truputį aukščiau. Valdyk judesį, nemėtyk kojos per jėgą.",

  front_split: { n: "Išilginis špagatas", v: "side", d: "Lėtai slink kojomis į priekį ir atgal, rankomis remkis į grindis ar knygas. Dubuo žiūri tiesiai. Sustok ties tempimu, ne skausmu.",

  let counter;
  if (s.type === "reps") counter = h("div", { class: "big" }, "× " + s.v, h("small", {}, "kartų" + (s.side ? " šia koja" : "")));
  else counter = h("div", { class: "big" + (P_.phase === "prep" ? " prep" : "") }, "0", h("small", {}, P_.phase === "prep" ? "pasiruošk" : (s.type === "hold" ? "laikyk" : "judėk")));
  const mainBtn = s.type === "reps"
    ? h("button", { class: "btn", on: { click: () => { beep(990, .2); goStep(P_.i + 1); } } }, "Atlikta ✓")
    : h("button", { class: "btn", on: { click: () => { P_.paused = !P_.paused; P_.last = performance.now(); renderPlayer(false); } } }, P_.paused ? "▶ Tęsti" : "❚❚ Pauzė");
  r.replaceChildren(h("div", { class: "p-in" },
    h("div", { class: "p-top" },
      h("button", { class: "x", "aria-label": "Uždaryti", on: { click: closePlayer } }, "✕"),
      h("div", { class: "meter" }, h("i", { style: "width:" + (P_.i / total * 100) + "%" })),
      h("span", { class: "muted num", style: "font-size:.85rem" }, (P_.i + 1) + "/" + total)),
    fig,
    h("div", { class: "p-name" }, s.side ? h("span", { class: "side" }, s.side) : null, h("h2", {}, ex.n), h("p", { class: "p-desc" }, ex.d)),
    counter,
    h("div", { class: "ctrl" },
      h("button", { class: "round", "aria-label": "Ankstesnis", on: { click: () => goStep(P_.i - 1) } }, "‹"),
      mainBtn,
      h("button", { class: "round", "aria-label": "Praleisti", on: { click: () => goStep(P_.i + 1) } }, "›")),
    h("p", { class: "next-up" }, nxt ? "Toliau: " + EX[nxt.id].n + (nxt.side ? " (" + nxt.side.toLowerCase() + ")" : "") : "Paskutinis pratimas")));
  updateCounter();
}
function finish() {
  P_.phase = "fin";
  store.done[P_.n] = Date.now(); save();
  beep(880, .15); setTimeout(() => beep(1320, .3), 180); buzz([100, 60, 100, 60, 200]);
  const n = P_.n;
  P_.root.replaceChildren(h("div", { class: "p-in" }, h("div", { class: "fin" },
    h("div", { class: "big" }, "✓"),
    h("h1", {}, "Diena " + n + " atlikta"),
    h("p", { class: "muted" }, n < 28 ? "Puiku. Rytoj laukia diena " + (n + 1) + ": " + TYPES[DAYS[n].type].n.toLowerCase() + "." : "Programa baigta! Pakartok 4 savaitę ir stebėk pažangą."),
    h("button", { class: "btn block", on: { click: () => { location.hash = ""; closePlayer(); } } }, "Į programą"))));
}

route();
</script>
